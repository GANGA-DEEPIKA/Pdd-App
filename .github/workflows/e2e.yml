name: e2e.yml

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  selenium_web_tests:
    name: 🌐 Selenium Web Tests (500)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install exceljs

      - name: Run Selenium Web Tests (500 Test Cases)
        run: node scripts/run-suite.js selenium

      - name: Upload Selenium Web Report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: reports/selenium-web-report.xlsx
          retention-days: 30

  appium_android_tests:
    name: 📱 Appium Android Tests (500)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install exceljs

      - name: Run Appium Android Tests (500 Test Cases)
        run: node scripts/run-suite.js appium

      - name: Upload Appium Android Report
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: reports/appium-android-report.xlsx
          retention-days: 30

  unit_api_tests:
    name: 🧪 Unit API Tests (500)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install exceljs

      - name: Run Unit API Tests (500 Test Cases)
        run: node scripts/run-suite.js unit

      - name: Upload Unit API Report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/unit-test-report.xlsx
          retention-days: 30

  validation_tests:
    name: ✅ Validation Tests (500)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install exceljs

      - name: Run Validation Tests (500 Test Cases)
        run: node scripts/run-suite.js validation

      - name: Upload Validation Report
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: reports/validation-test-report.xlsx
          retention-days: 30

  deployment_status_tests:
    name: 🚀 Deployment Status Tests (500)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install exceljs

      - name: Run Deployment Status Tests (500 Test Cases)
        run: node scripts/run-suite.js deployment

      - name: Upload Deployment Status Report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: reports/deployment-test-report.xlsx
          retention-days: 30

  load_performance_tests:
    name: ⚡ Load Performance Tests (500)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install exceljs

      - name: Run Load Performance Tests (500 Test Cases)
        run: node scripts/run-suite.js load

      - name: Upload Load Performance Report
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: reports/load-test-report.xlsx
          retention-days: 30

  vulnerability_tests:
    name: 🔒 Vulnerability Tests (500)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install exceljs

      - name: Run Vulnerability Tests (500 Test Cases)
        run: node scripts/run-suite.js vulnerability

      - name: Upload Vulnerability Report
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-test-report
          path: reports/vulnerability-test-report.xlsx
          retention-days: 30

  full_e2e_tests:
    name: 🔄 Full E2E Tests (500)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install exceljs

      - name: Run Full E2E Tests (500 Test Cases)
        run: node scripts/run-suite.js full-e2e

      - name: Upload Full E2E Report
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: reports/full-e2e-report.xlsx
          retention-days: 30

  compile_master_excel_report:
    name: 📊 Compile Master Excel Report & Upload
    needs:
      - selenium_web_tests
      - appium_android_tests
      - unit_api_tests
      - validation_tests
      - deployment_status_tests
      - load_performance_tests
      - vulnerability_tests
      - full_e2e_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install exceljs

      - name: Download All Generated Reports
        uses: actions/download-artifact@v4
        with:
          path: downloaded-reports

      - name: Compile Master Excel Report & Publish Summary
        run: node scripts/compile-master-report.js

      - name: Upload Master Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Master-Excel-Report
          path: reports/E2E-Master-Excel-Report.xlsx
          retention-days: 30
