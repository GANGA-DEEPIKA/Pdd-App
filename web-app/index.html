<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusFix — Smart Complaint Management</title>
  <meta name="description" content="CampusFix is a smart campus complaint management system for students, staff, and administrators." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Firebase SDK -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js?v=3"></script>
</head>
<body>
  <div id="app">
    <!-- Splash loader while Firebase initialises -->
    <div id="splash" class="splash">
      <div class="splash-content">
        <div class="splash-icon">🎓</div>
        <h1 class="splash-title">CampusFix</h1>
        <p class="splash-sub">Smart Complaint Management</p>
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <!-- Toast notification container -->
  <div id="toast-container"></div>
</body>
</html>
